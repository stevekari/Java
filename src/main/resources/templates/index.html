<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CafeMachine — Brew</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body>
    <h1 class="brand">CAFÉ <span>MACHINE</span></h1>

    <div class="machine">
      <!-- TOP CHROME -->
      <div class="machine-top">
        <div class="logo-plate">STEVE KK</div>
        <div class="leds">
          <div class="led green" title="Power ON"></div>
          <div class="led amber" title="Heating"></div>
        </div>
      </div>

      <!-- SCREEN -->
      <div class="screen-wrap">
        <div class="screen-label">// STATUS</div>
        <div class="screen-text" id="display">
          READY TO BREW<span class="cursor"></span>
        </div>
      </div>

      <!-- DECORATIVE RIVETS -->
      <div class="rivets">
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
        <div class="rivet"></div>
      </div>

      <!-- ★ SPRING BOOT FORM — posts to WebController @PostMapping("/make") ★ -->
      <form th:action="@{/make}" method="post" class="brew-form" id="brewForm">
        <div class="selector-row">
          <div class="selector-group">
            <label for="type">Coffee Type</label>
            <select id="type" name="type">
              <option value="espresso">Espresso</option>
              <option value="cappuccino">Cappuccino</option>
              <option value="americano">Americano</option>
            </select>
          </div>
          <div class="selector-group">
            <label for="size">Size</label>
            <select id="size" name="size">
              <option value="short">Short</option>
              <option value="long">Long</option>
            </select>
          </div>
        </div>

        <div class="brew-wrap">
          <button type="submit" class="brew-btn" id="brewBtn">BREW NOW</button>
        </div>
      </form>
      <!-- ★ END FORM ★ -->

      <!-- SPOUT -->
      <div class="spout-area">
        <div class="spout-head"></div>
        <div class="spout-neck"></div>
        <div class="drips" id="drips">
          <div class="drip"></div>
          <div class="drip"></div>
          <div class="drip"></div>
        </div>
      </div>

      <!-- CUP + TRAY -->
      <div class="tray-wrap">
        <div class="cup-stage">
          <div class="cup-column">
            <div class="steam-row" id="steam">
              <div class="steam"></div>
              <div class="steam"></div>
              <div class="steam"></div>
            </div>
            <div class="cup" id="cup"></div>
          </div>
        </div>
        <div class="tray"></div>
        <div class="tray-base"></div>
      </div>

      <!-- STATUS BAR -->
      <div class="status-bar">
        <div class="status-item">
          <div class="status-dot g"></div>
          WATER OK
        </div>
        <div class="status-item">
          <div class="status-dot o"></div>
          BEANS OK
        </div>
        <div class="status-item">
          <div class="status-dot g"></div>
          MILK OK
        </div>
      </div>
    </div>
    <!-- /.machine -->

    <script>
      // Play brew animation THEN submit to Spring Boot
      document
        .getElementById("brewForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const type = document.getElementById("type").value;
          const display = document.getElementById("display");

          // typewriter on screen
          const msg = "BREWING " + type.toUpperCase() + "...";
          display.innerHTML = "";
          let i = 0;
          const iv = setInterval(() => {
            display.innerHTML =
              msg.slice(0, i) + '<span class="cursor"></span>';
            if (i++ >= msg.length) clearInterval(iv);
          }, 42);

          // drips from spout
          document.querySelectorAll(".drip").forEach((d) => {
            d.classList.remove("flowing");
            void d.offsetWidth;
          });
          setTimeout(
            () =>
              document
                .querySelectorAll(".drip")
                .forEach((d) => d.classList.add("flowing")),
            100,
          );

          // cup rises
          setTimeout(
            () => document.getElementById("cup").classList.add("visible"),
            450,
          );

          // steam
          setTimeout(() => {
            document.querySelectorAll(".steam").forEach((s) => {
              void s.offsetWidth;
              s.classList.add("rising");
            });
          }, 950);

          // fire the real POST to /make after animation
          setTimeout(() => this.submit(), 1700);
        });
    </script>
  </body>
</html>
